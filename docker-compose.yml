version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: wismaamal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: wismaamal
      MYSQL_USER: wismaamal
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - wismaamal_network

  backend-app:
    image: ghcr.io/alfian-code/wismaamal-backend-app:latest
    container_name: wismaamal_backend_app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://api-wismaamal.allvvnt.my.id
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=wismaamal
      - DB_USERNAME=wismaamal
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - APP_KEY=${APP_KEY:-base64:E4B2ZkG1s...} # SET THIS IN ENV!
      - MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION}
      - MIDTRANS_NOTIFICATION_URL=${MIDTRANS_NOTIFICATION_URL}
      - MIDTRANS_ENABLED_PAYMENTS=${MIDTRANS_ENABLED_PAYMENTS}
      - FONNTE_TOKEN=${FONNTE_TOKEN}
    depends_on:
      - mysql
    volumes:
      - wismaamal_storage:/var/www/storage
    networks:
      - wismaamal_network

  backend-web:
    image: ghcr.io/alfian-code/wismaamal-backend-web:latest
    container_name: wismaamal_backend_web
    restart: unless-stopped
    ports:
      - "8001:80"
    depends_on:
      - backend-app
    networks:
      - wismaamal_network

  frontend-web:
    image: ghcr.io/alfian-code/wismaamal-frontend-web:latest
    container_name: wismaamal_frontend_web
    restart: unless-stopped
    ports:
      - "8002:80"
    networks:
      - wismaamal_network

volumes:
  mysql_data:
  wismaamal_storage:

networks:
  wismaamal_network:
    driver: bridge
